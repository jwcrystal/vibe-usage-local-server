<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Usage · 本地</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #171717;
    --border: #292929;
    --text: #ffffff;
    --text2: #a1a1a1;
    --text3: #616161;
    --accent: #33cc99;
    --radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    padding: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 700; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--text3); font-size: 11px; }
  .ranges { display: flex; gap: 6px; }
  .ranges button {
    background: transparent; color: var(--text2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 14px; cursor: pointer; font-size: 12px;
  }
  .ranges button.active { background: var(--card); color: var(--text); border-color: var(--text3); }
  .empty { color: var(--text3); text-align: center; padding: 60px 0; font-size: 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card .label { color: var(--text3); font-size: 11px; margin-bottom: 6px; }
  .card .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .value.accent { color: var(--accent); }
  .card .hint { color: var(--text3); font-size: 10px; margin-top: 3px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; }
  .panel h2 { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text2); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 16px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text3); font-weight: 500; font-size: 11px; border-bottom: 1px solid var(--border); }
  td { border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  td.name { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-cell { position: relative; }
  .bar { position: absolute; left: 0; top: 25%; bottom: 25%; width: var(--w); background: var(--accent); opacity: 0.18; border-radius: 2px; }
  .num { position: relative; }

  /* daily bars */
  .daily { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 16px; }
  .daily .day { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
  .daily .day .bar { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; opacity: 0.8; }
  .daily .day .lbl { color: var(--text3); font-size: 9px; transform: rotate(-45deg); white-space: nowrap; }
  .muted { color: var(--text3); }
</style>
</head>
<body>
  <header>
    <div>
      <h1><span class="dot">●</span> vibe-usage <span class="sub">本地 dashboard</span></h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="ranges" id="ranges">
      <button data-days="7">7D</button>
      <button data-days="30" class="active">30D</button>
      <button data-days="90">90D</button>
    </div>
  </header>

  <div id="app"><div class="empty">載入中…</div></div>

<script>
// API key injected server-side (localhost only).
const API_KEY = __VIBE_API_KEY__;
const API = '/api/usage';

let days = 30;
let data = null;

const $ = (s) => document.querySelector(s);
const money = (v) => v == null ? '—' : '$' + v.toFixed(2);
const fmtTok = (n) => {
  n = n || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return String(n);
};
const fmtH = (sec) => {
  if (!sec) return '0m';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
};
const pct = (v, total) => total > 0 ? (v / total * 100).toFixed(0) + '%' : '0%';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const r = await fetch(API + '?days=' + days + '&tz=' + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone), {
    headers: { 'Authorization': 'Bearer ' + API_KEY }
  });
  if (r.status === 401) { $('#app').innerHTML = '<div class="empty">認證失敗 — 檢查 server 的 API key</div>'; return; }
  data = await r.json();
  render();
}

function render() {
  const buckets = data.buckets || [];
  if (buckets.length === 0) {
    $('#app').innerHTML = '<div class="empty">暫無數據。先跑 sync: <code>npx @vibe-cafe/vibe-usage sync</code></div>';
    $('#meta').textContent = '';
    return;
  }
  const sess = data.sessions || [];
  const totalCost = buckets.reduce((s, b) => s + (b.estimatedCost || 0), 0);
  const totalTok = buckets.reduce((s, b) => s + computeTotal(b), 0);
  const cachedTok = buckets.reduce((s, b) => s + (b.cachedInputTokens || 0), 0);
  const activeSec = sess.reduce((s, x) => s + (x.activeSeconds || 0), 0);
  const durationSec = sess.reduce((s, x) => s + (x.durationSeconds || 0), 0);
  const msgCount = sess.reduce((s, x) => s + (x.messageCount || 0), 0);

  $('#meta').textContent = buckets.length + ' buckets · ' + sess.length + ' sessions · 已同步本地 ' + days + ' 天';

  const cards = [
    { l: '總成本', v: money(totalCost), accent: true },
    { l: '總 Token', v: fmtTok(totalTok) },
    { l: '快取 Token', v: fmtTok(cachedTok) },
    { l: 'Active 時長', v: fmtH(activeSec) },
    { l: '總時長', v: fmtH(durationSec) },
    { l: '消息', v: fmtTok(msgCount) },
  ];
  $('#app').innerHTML =
    '<div class="cards">' + cards.map(c =>
      '<div class="card"><div class="label">' + c.l + '</div><div class="value' + (c.accent ? ' accent' : '') + '">' + c.v + '</div></div>'
    ).join('') + '</div>' +
    dailyBars(buckets) +
    distPanel('按模型', byKey(buckets, 'model'), totalCost) +
    distPanel('按工具', byKey(buckets, 'source'), totalCost);
}

function computeTotal(b) {
  return (b.inputTokens || 0) + (b.outputTokens || 0) + (b.reasoningOutputTokens || 0) + (b.cachedInputTokens || 0);
}

function byKey(buckets, key) {
  const m = new Map();
  for (const b of buckets) {
    const k = b[key] || 'unknown';
    const e = m.get(k) || { cost: 0, tokens: 0, n: 0 };
    e.cost += b.estimatedCost || 0;
    e.tokens += computeTotal(b);
    e.n += 1;
    m.set(k, e);
  }
  return [...m.entries()].sort((a, b) => b[1].cost - a[1].cost);
}

function dailyBars(buckets) {
  const byDay = new Map();
  for (const b of buckets) {
    const d = (b.bucketStart || '').slice(0, 10);
    if (!d) continue;
    byDay.set(d, (byDay.get(d) || 0) + (b.estimatedCost || 0));
  }
  const daysArr = [...byDay.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  const max = Math.max(1, ...daysArr.map(x => x[1]));
  const bars = daysArr.map(([d, v]) =>
    '<div class="day"><div class="lbl">' + d.slice(5) + '</div><div class="bar" style="height:' + (v / max * 100) + '%" title="' + d + ' ' + money(v) + '"></div></div>'
  ).join('');
  const panel = '<div class="panel"><h2>每日成本</h2><div class="daily">' + (bars || '<div class="muted" style="padding:16px">無數據</div>') + '</div></div>';
  return panel;
}

function distPanel(title, rows, totalCost) {
  const max = rows.length ? rows[0][1].cost : 0;
  const trs = rows.map(([name, e]) =>
    '<tr><td class="name" title="' + esc(name) + '">' + esc(name) + '</td>' +
    '<td class="bar-cell"><div class="bar" style="--w:' + (max > 0 ? (e.cost / max * 100) : 0) + '%"></div><span class="num">' + money(e.cost) + '</span></td>' +
    '<td>' + fmtTok(e.tokens) + '</td>' +
    '<td>' + pct(e.cost, totalCost) + '</td>' +
    '<td>' + e.n + '</td></tr>'
  ).join('');
  return '<div class="panel"><h2>' + title + '</h2><table><thead><tr><th>名稱</th><th>成本</th><th>Token</th><th>佔比</th><th>Buckets</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
}

document.getElementById('ranges').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  days = Number(btn.dataset.days);
  document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('active', b === btn));
  load();
});

load();
</script>
</body>
</html>
